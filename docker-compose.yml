version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: goticket_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: goticket
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - goticket_net

  redis:
    image: redis:7
    container_name: goticket_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - goticket_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: goticket_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - goticket_net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: goticket_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - goticket_net

volumes:
  mysql_data:
  redis_data:

networks:
  goticket_net:
    driver: bridge
